<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='5' fill='%236965db'/%3E%3Cpath d='M13 11l9 5-9 5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Excalidraw Presenter</title>
    <script>
      // Must be set before any Excalidraw module code runs so scene fonts are
      // fetched from this origin (copied into /public/fonts) instead of a CDN.
      window.EXCALIDRAW_ASSET_PATH = "/";
      // Apply the chrome theme before first paint to avoid a flash.
      var theme = localStorage.getItem("presenter-theme");
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      document.documentElement.dataset.theme = theme;
    </script>
    <link
      rel="preload"
      href="/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
